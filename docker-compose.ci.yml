services:
  wiremock:
    image: wiremock/wiremock:3.13.1
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock/mappings:/home/wiremock/mappings:ro
      - ./docker/wiremock/__files:/home/wiremock/__files:ro

  app:
    environment:
      GUTENDEX_BASE_URL: http://wiremock:8080/books
    depends_on:
      wiremock:
        condition: service_started
