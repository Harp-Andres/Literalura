name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Las ejecuciones que pueden desplegar comparten una cola y corren enteras en
# orden. Las que verificar va a omitir (CI fallido o cancelado, otra rama)
# usan un grupo propio para no reemplazar un despliegue pendiente.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
      && 'cd'
      || format('cd-omitido-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar:
    name: verificar
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Resolver el commit de main que paso CI
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            sha="$RUN_SHA"
          else
            sha="$GITHUB_SHA"
            exitosas=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$sha" -f branch=main -f event=push -f status=success \
              --jq '.total_count')
            if [ "$exitosas" -eq 0 ]; then
              echo "::error::CI no tiene una ejecucion exitosa en main para $sha"
              exit 1
            fi
          fi
          echo "Se despliega $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # La subida va en un job aparte: si deploy-pages corre en el mismo job,
  # a veces no ve el artefacto recien subido (actions/deploy-pages#451).
  artefacto-pages:
    name: artefacto-pages
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verificar.outputs.sha }}
      - name: Verificar que site solo tiene archivos publicables
        run: bash .github/scripts/verificar-site.sh site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    name: pages
    needs: artefacto-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
