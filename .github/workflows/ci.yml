name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: literalura
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: literalura/pom.xml
      - run: chmod +x mvnw && ./mvnw -B test

  database:
    name: database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: literalura
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: literalura/pom.xml
      - run: chmod +x mvnw && ./mvnw -B test -Pdatabase

  integration:
    name: integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: literalura
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: literalura/pom.xml
      - run: chmod +x mvnw && ./mvnw -B test -Pintegration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: literalura/pom.xml
      - name: Empaquetar la aplicacion
        working-directory: literalura
        run: chmod +x mvnw && ./mvnw -B -DskipTests package
      - name: Levantar base, WireMock y aplicacion
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up --build -d --wait
      - name: Esperar a WireMock
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8089/__admin/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs wiremock
          exit 1
      - name: Pruebas de extremo a extremo
        working-directory: literalura
        run: chmod +x mvnw && ./mvnw -B test -Pe2e
      - name: Logs del sistema
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
      - name: Bajar el sistema
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  site:
    name: site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site-tests/package-lock.json
      - run: npm ci
      - name: Pruebas unitarias del sitio
        run: npm run test:unit
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo del sitio
        run: npm run test:e2e
      - name: Verificar que site solo tiene archivos publicables
        working-directory: .
        run: bash .github/scripts/verificar-site.sh site
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: site-tests/playwright-report
          retention-days: 7
